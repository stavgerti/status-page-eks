# The store every ExternalSecret in the cluster reads through.
#
# ClusterSecretStore rather than a namespaced SecretStore so the application
# chart can reference it by name from whatever namespace it ends up in, without
# needing a store object of its own.
#
# There is deliberately no `auth:` block. That is where an IRSA service-account
# reference would go; with iam:CreateOpenIDConnectProvider denied in this
# account there's no OIDC provider to bind to, so the AWS SDK falls through to
# instance metadata and picks up the node role instead. infra/iam grants that
# role secretsmanager read on the stav-status-page/ prefix only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
