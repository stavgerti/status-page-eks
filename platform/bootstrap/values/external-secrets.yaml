# External Secrets Operator — pulls secrets from AWS Secrets Manager and
# materialises them as Kubernetes Secrets.
#
# This is what keeps the database password out of git, Helm values and GitHub
# Secrets: Terraform generates it and writes it to Secrets Manager, ESO reads it
# from there, and the application only ever sees a normal Kubernetes Secret.
#
# It authenticates through the node role rather than IRSA — this account denies
# iam:CreateOpenIDConnectProvider, so there is no OIDC provider to bind a
# per-pod identity to. The honest trade-off: node-role credentials are reachable
# by any pod on the node, so ESO here delivers centralised storage and rotation
# but not the per-pod isolation IRSA would add. infra/iam scopes the permission
# to the stav-status-page/ secret prefix to limit the blast radius.

installCRDs: true

replicaCount: 1

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
