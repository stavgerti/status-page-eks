# cert-manager — issues and renews the TLS certificate from Let's Encrypt.
#
# This exists because ACM is denied in this account, and an ALB can only load
# certificates from ACM. Terminating TLS inside the cluster with a cert-manager
# certificate is what makes HTTPS possible at all here, and it's why the load
# balancer is an NLB passing TCP through rather than an ALB.
#
# Challenges are solved with DNS-01, not HTTP-01. HTTP-01 was the original plan
# and would have needed no AWS access at all, but it works by creating a second,
# temporary Ingress for the same host — which F5's ingress controller rejects.
# See manifests/cluster-issuers.yaml for the full story.
#
# So cert-manager does call AWS: it writes a TXT record in the Route 53 zone.
# It gets no policy of its own — with no IRSA in this account it authenticates
# as the node role, which already carries the `externaldns` inline policy
# granting exactly those calls on exactly that zone.

crds:
  enabled: true

replicaCount: 2

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi
