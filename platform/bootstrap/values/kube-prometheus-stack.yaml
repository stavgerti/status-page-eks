# Prometheus, Grafana and Alertmanager.
#
# Sized for a two-node t3.medium cluster that is already running the ingress
# controller, cert-manager, ESO, ExternalDNS, ArgoCD and the application. The
# defaults in this chart assume a much larger cluster and will not schedule
# here, so most of what follows is trimming rather than tuning.

prometheus:
  prometheusSpec:
    # The chart defaults to watching only resources it created. Turning these
    # off makes Prometheus pick up any ServiceMonitor in the cluster, which is
    # what lets the application be scraped without editing this file.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Long enough to show trends during a demo, short enough to stay inside the
    # volume below.
    retention: 7d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  # Password comes from --set at install time rather than living in git.
  adminPassword: ""

  persistence:
    enabled: true
    storageClassName: gp3
    size: 2Gi

  # 256Mi was too tight and got the container OOMKilled the moment real
  # dashboards were opened - Grafana loads panel data and query results into
  # memory, so browsing costs far more than sitting idle. The pod count ceiling
  # that forced everything to be trimmed is gone now that prefix delegation is
  # on, so there is room to be realistic.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

  # ClusterIP, with the Ingress below routing to it - the ingress controller
  # reaches the Service from inside the cluster, so nothing needs a node port
  # or a load balancer of its own.
  service:
    type: ClusterIP

  # Exposed on its own subdomain, on the mentor's recommendation. Nothing here
  # had to be built for it: ExternalDNS sees this Ingress and writes the A
  # record, cert-manager sees the annotation and issues the certificate. That
  # is the whole point of having those two controllers.
  #
  # Issued against staging first - the registered domain is lvtvv.com, the
  # mentor's, and Let's Encrypt caps 50 certificates per week per registered
  # domain, so a failed loop against production spends his quota rather than
  # ours. Staging came back Ready in 45s and the host served Grafana's login
  # page, which proved the whole chain (ExternalDNS wrote the record, the TXT
  # challenge validated, the ingress routed), so this is now on production.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.devops.lvtvv.com
    path: /
    pathType: Prefix
    tls:
      - hosts:
          - grafana.devops.lvtvv.com
        secretName: grafana-tls

  grafana.ini:
    server:
      # Grafana builds redirects and asset links from this. Left unset behind a
      # proxy it emits localhost URLs and the login redirect breaks.
      root_url: https://grafana.devops.lvtvv.com
    users:
      # It is a single-admin instance; nobody should be able to create accounts.
      allow_sign_up: false
    auth.anonymous:
      # Default already, but stated explicitly now that the page is reachable
      # from the internet rather than only through a port-forward.
      enabled: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

# Runs on every node to collect CPU, memory, disk and network metrics.
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# Turns Kubernetes object state (pod phases, deployment replicas, restart
# counts) into metrics — the source for most of the useful dashboards.
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

# EKS does not expose the control plane, so these scrape targets can never be
# reached and would sit permanently red on the dashboards. AWS runs and
# monitors those components; leaving them enabled only teaches you to ignore
# alerts.
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
