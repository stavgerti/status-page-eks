# ArgoCD — pulls the application's Helm chart from git and reconciles it into
# the cluster.
#
# This is the point of the GitOps split: CI builds an image, pushes it to ECR
# and bumps the tag in values.yaml, and never touches the cluster. ArgoCD, from
# inside the cluster, notices the commit and applies it. Nothing outside the
# cluster ever holds cluster credentials.
#
# ArgoCD is installed by Helm rather than managed by ArgoCD itself, for the
# obvious bootstrap reason.

global:
  domain: argocd.devops.lvtvv.com

configs:
  params:
    # The ingress controller terminates TLS, so argocd-server must not also try
    # to. Without this it serves HTTPS itself and the ingress talks TLS to a TLS
    # backend, producing redirect loops.
    server.insecure: true

server:
  replicas: 2

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      # Promoted to production after a staging certificate was issued and
      # served successfully — the chain (delegated DNS, NLB, ingress,
      # cert-manager, Lets Encrypt) is proven, so this will not waste quota.
      #
      # Anything NEW still starts on letsencrypt-staging. Production allows 5
      # duplicate certificates per week per hostname set, and 50 per week per
      # registered domain — and the registered domain here is lvtvv.com, the
      # mentors, so debugging against production spends his quota.
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hostname: argocd.devops.lvtvv.com
    tls: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  # No external identity provider in this project — local admin only.
  enabled: false
