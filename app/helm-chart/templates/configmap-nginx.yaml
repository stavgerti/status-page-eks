apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-page.fullname" . }}-nginx
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 8080;

        client_max_body_size 25m;

        location /static/ {
            alias /shared-static/;
        }

        # Metrics are not served on the public port - only on 9090 below, which
        # the Service exposes as a separate port the Ingress never references.
        # Without this, /metrics would be reachable from the internet through
        # this same location's proxy_pass, since it's a prefix match on /.
        location /metrics {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            # ALB already terminated TLS and set these - pass through as-is, do not
            # regenerate from $scheme (nginx only ever sees plain HTTP from the ALB).
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Cluster-internal only: the Service's "metrics" port is never referenced by
    # the Ingress, so this listener is unreachable from outside the cluster.
    # Prometheus's ServiceMonitor scrapes here directly, bypassing the Ingress.
    server {
        listen 9090;

        location /metrics {
            # django-prometheus 2.3.1 registers its own view at path "metrics"
            # (no slash), included under our path('metrics/', ...) - Django
            # concatenates those raw, so the real route is /metrics/metrics,
            # not /metrics or /metrics/. Confirmed directly against gunicorn:
            # /metrics and /metrics/ both 404, /metrics/metrics returns 200.
            proxy_pass http://127.0.0.1:8001/metrics/metrics;
            # Prometheus scrapes by pod IP, not $http_x_forwarded_host - passing
            # that through as Host fails Django's ALLOWED_HOSTS check with 400,
            # same failure mode the web readiness probe works around above.
            proxy_set_header Host {{ .Values.ingress.host | quote }};
        }

        location / {
            return 404;
        }
    }
