apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-page.fullname" . }}-nginx
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 8080;

        client_max_body_size 25m;

        location /static/ {
            alias /shared-static/;
        }

        # Metrics are not served on the public port - only on 9090 below, which
        # the Service exposes as a separate port the Ingress never references.
        # Without this, /metrics would be reachable from the internet through
        # this same location's proxy_pass, since it's a prefix match on /.
        location /metrics {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            # ALB already terminated TLS and set these - pass through as-is, do not
            # regenerate from $scheme (nginx only ever sees plain HTTP from the ALB).
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Cluster-internal only: the Service's "metrics" port is never referenced by
    # the Ingress, so this listener is unreachable from outside the cluster.
    # Prometheus's ServiceMonitor scrapes here directly, bypassing the Ingress.
    server {
        listen 9090;

        location /metrics {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
        }

        location / {
            return 404;
        }
    }
