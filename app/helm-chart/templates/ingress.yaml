apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-page.fullname" . }}
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  # alb - provisioned by your teammate's AWS Load Balancer Controller install.
  # This chart only ever references that controller by class name, never installs it.
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "status-page.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
