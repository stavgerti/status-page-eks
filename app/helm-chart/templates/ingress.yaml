apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "status-page.fullname" . }}
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  # nginx - ACM is blocked in the course account and an ALB can only take ACM
  # certs, so HTTPS via ALB isn't possible here. TLS terminates in-cluster via
  # cert-manager + Let's Encrypt instead, behind an NLB.
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "status-page.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
