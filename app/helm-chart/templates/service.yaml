apiVersion: v1
kind: Service
metadata:
  name: {{ include "status-page.fullname" . }}-web
  labels:
    {{- include "status-page.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  # Points at the nginx sidecar's port, not gunicorn directly - gunicorn only
  # binds 127.0.0.1 inside the pod and is unreachable from the Service anyway.
  selector:
    {{- include "status-page.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
    # Separate from "http" so /metrics is never reachable through the Ingress,
    # which only ever backends onto the "http" port. Only the ServiceMonitor
    # (scraping the Service directly, in-cluster) targets this one.
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
