apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "status-page.fullname" . }}
  labels:
    {{- include "status-page.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook, and it mounts the
    # Secret this ExternalSecret produces. As a plain resource this would be
    # applied only after hooks finish, so the Job would start against a Secret
    # that doesn't exist yet and sit in CreateContainerConfigError forever.
    #
    # Making it a hook too, at a lower weight, puts it ahead of the migration.
    # hook-delete-policy is deliberately omitted: the Secret it produces has to
    # outlive the hook phase, since the long-running Deployments consume it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "status-page.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .property }}
    {{- end }}
