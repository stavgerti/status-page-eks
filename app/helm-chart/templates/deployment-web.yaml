apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "status-page.fullname" . }}-web
  labels:
    {{- include "status-page.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "status-page.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        # ConfigMap is mounted via subPath, which never picks up live updates
        # (not after a minute, not ever) - the pod has to actually restart to
        # see a new nginx.conf. This annotation changes whenever the
        # ConfigMap's content changes, which changes the pod template, which
        # makes the Deployment roll itself instead of quietly serving stale
        # config indefinitely.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
      labels:
        {{- include "status-page.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      # Static files are collectstatic'd into the app image at build time. This
      # copies them into the emptyDir the nginx sidecar reads from - the sidecar's
      # own container image has no access to the app image's filesystem otherwise.
      initContainers:
        - name: copy-static
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # -r, not -a: the image runs as a non-root user, and -a also tries to
          # preserve timestamps on the emptyDir's mount point itself, which that
          # user doesn't own — "cp: preserving times for '/shared-static/.':
          # Operation not permitted", which failed the init container and kept
          # the web pods in Init:Error. Ownership and timestamps on static assets
          # don't matter here; nginx only needs to read them.
          command: ["sh", "-c", "cp -r /opt/status-page/statuspage/static/. /shared-static/"]
          volumeMounts:
            - name: shared-static
              mountPath: /shared-static
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: {{ include "status-page.fullname" . }}-secrets
          env:
            - name: ALLOWED_HOSTS
              value: {{ .Values.env.allowedHosts | quote }}
            - name: SITE_URL
              value: {{ .Values.env.siteUrl | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_SSL
              value: {{ .Values.env.redisSsl | quote }}
            # gunicorn runs 5 workers - without this, a /metrics scrape only
            # ever sees whichever single worker answered the request, not an
            # aggregate. gunicorn.conf.py cleans up recycled workers' files.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          # Proves the gunicorn process is alive without touching the DB/Redis -
          # a transient DB blip should not cause a pod restart on its own.
          # gunicorn binds 127.0.0.1 on purpose - only the nginx sidecar should
          # reach it - so a tcpSocket probe can't be used: the kubelet dials the
          # pod IP, nothing is listening there, and it killed the container
          # roughly 55s after every start. An exec probe runs inside the
          # container, where 127.0.0.1 is the right address, and still proves
          # the socket is accepting rather than merely that a process exists.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
        - name: nginx
          image: {{ .Values.nginx.image }}
          ports:
            - containerPort: 8080
            - containerPort: 9090
          volumeMounts:
            - name: shared-static
              mountPath: /shared-static
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          # Proves the full stack (nginx + gunicorn + DB + Redis) is actually
          # serving - pulls the pod out of the Service if any of that fails.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              # Without this the kubelet sends the pod IP as the Host header,
              # Django compares it against ALLOWED_HOSTS, rejects it with 400,
              # and the pod never becomes ready. Sending the real hostname makes
              # the probe look like the traffic this pod actually serves.
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-static
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "status-page.fullname" . }}-nginx
