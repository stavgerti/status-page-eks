name: Secret scan

# Runs on every push and PR, scanning the full commit range being pushed -
# not just the working tree. Catches a leaked secret even if it was later
# removed in a follow-up commit; git history keeps it either way.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists the PR's commits via the API on pull_request
  # events - without this it 403s instead of scanning.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
